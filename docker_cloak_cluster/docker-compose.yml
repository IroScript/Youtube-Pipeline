version: '3.8'

networks:
  cloak_cluster_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  # =============================================================
  # GROUP A: 5 CLOAKBROWSER PROMPT & SEO WORKERS (W1 to W5)
  # =============================================================
  prompt-seo-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.prompt_worker
    image: cloak_prompt_worker:latest
    container_name: prompt_seo_worker_1
    restart: unless-stopped
    mem_limit: 1536m
    shm_size: 1g
    ports:
      - "8001:8000"
    environment:
      - WORKER_ID=worker_1
      - PORT=8000
      - DB_PATH=/app/database/youtube_pipeline.db
      - PROFILE_DIR=/app/profile
    volumes:
      - ./profiles_prompt/worker_1:/app/profile:rw
      - ./cookies:/app/cookies:rw
      - ../PromptDatabase/database:/app/database:rw
    networks:
      - cloak_cluster_net

  prompt-seo-worker-2:
    image: cloak_prompt_worker:latest
    container_name: prompt_seo_worker_2
    restart: unless-stopped
    mem_limit: 1536m
