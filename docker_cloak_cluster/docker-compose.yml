  # =============================================================
  # GROUP B: 5 CLOAKBROWSER VEO 3.1 FLOW WORKERS (W1 to W5)
  # =============================================================
  veo-flow-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.veo_worker
    image: cloak_veo_worker:latest
    container_name: veo_flow_worker_1
    restart: unless-stopped
    mem_limit: 1536m
    shm_size: 1g
    ports:
      - "8101:8102"
    environment:
      - WORKER_ID=worker_1
      - PORT=8102
      - DB_PATH=/app/database/youtube_pipeline.db
      - PROFILE_DIR=/app/profile
      - DOWNLOADS_DIR=/app/downloads
    volumes:
      - ./profiles_veo/worker_1:/app/profile:rw
      - ./downloads/worker_1:/app/downloads:rw
      - ../PromptDatabase/database:/app/database:rw
      - ./10SecNewExtension:/app/10SecNewExtension:ro
    networks:
