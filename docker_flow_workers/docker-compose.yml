version: '3.8'

networks:
  veo_flow_cluster_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16

services:
  flow-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flow_worker_1
    restart: unless-stopped
    mem_limit: 1536m
    shm_size: 1g
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8101:8102"
    environment:
      - WORKER_ID=flow_worker_1
      - PORT=8102
      - DISPLAY=:99
      - FLOW_URL=https://flow.google.com/project/b1798769-23be-4a97-9a59-4e6d979f6b3d
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/database/youtube_pipeline.db
      - DOWNLOADS_DIR=/app/downloads
      - TEMP_DIR=/app/temp
      - PROFILE_DIR=/app/profile
    volumes:
      - ./profiles/worker_1:/app/profile:rw
      - ./cookies/worker_1:/app/cookies:rw
      - ./downloads/worker_1:/app/downloads:rw
      - ./temp/worker_1:/app/temp:rw
      - ../PromptDatabase/database:/app/database:rw
      - ./10SecNewExtension:/app/10SecNewExtension:ro
      - ./flow_worker_server.py:/app/flow_worker_server.py:rw
      - ./flow_queue_manager.py:/app/flow_queue_manager.py:rw
      - ./browser_supervisor.py:/app/browser_supervisor.py:rw
    networks:
      - veo_flow_cluster_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8102/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

